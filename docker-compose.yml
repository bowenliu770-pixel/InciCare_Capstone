services:
  backend:
    build: .
    container_name: comhub-backend
    ports:
      - "5000:5000"
      - "515:515/udp"
    volumes:
      - ./data:/app/data
      - ./frontend:/app/frontend
    environment:
      - OLLAMA_MODEL=qwen2.5:3b
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: comhub-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
